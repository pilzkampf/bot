site_name: Pilzkampf-Bot Doc
site_url: https://pilzkampf.github.io/bot/
site_description: Dokumentation für den Pilzkampf Bot für Pikmin Bloom

theme:
  name: material
  language: de
  logo: assets/pilzkampf_bot.png
  favicon: assets/pilzkampf_bot.png
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Light mode
      primary: green
      accent: indigo
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Dark mode
      primary: amber
      accent: deep orange
  font:
    text: Merriweather Sans
    code: Red Hat Mono
  features:
    - navigation.footer
    - search.suggest
    - search.highlight
    - navigation.tracking

repo_url: https://github.com/pilzkampf/bot
repo_name: pilzkampf/bot

copyright: Copyright &copy; 2024 - 2025 Pilzkampf Bot Team

plugins:
  - i18n:
      default_language: de
      languages:
        - locale: en
          name: <img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f1ec-1f1e7.svg" height="20" style="vertical-align:middle;margin-right:0.3em;"> English
          build: true
          site_name: Pilzkampf Bot Manual
          site_description: Documentation for the Pilzkampf Bot for Pikmin Bloom
          nav:
            - Home: index.md
            - Mushroom Battle: 
              - Overview: battle.md
              - Create a mushroom offer: offer-mushroom.md
              - Joining a mushroom battle: join-mushroom.md
            - Commands:
              - Overview: commands.md
              - Settings: userconfig.md
              - Timer: timer.md
              - Profile: profile.md
              - List of active battles: active.md
              - Mushroom alert: alarm.md
            - Multiple Groups: federation.md
            - Privacy: privacy.md
            - Support: support.md
        - locale: de
          name: <img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f1e9-1f1ea.svg" height="20" style="vertical-align:middle;margin-right:0.3em;"> Deutsch
          build: true
          default: true
          site_name: Pilzkampf-Bot Anleitung
          site_description: Dokumentation für den Pilzkampf Bot für Pikmin Bloom
          nav:
            - Startseite: index.md
            - Pilzkampf: 
              - Pilzkampf Übersicht: battle.md
              - Pilzkampf erstellen: offer-mushroom.md
              - Pilzkampf beitreten: join-mushroom.md
            - Kommandos:
              - Übersicht: commands.md
              - Einstellungen: userconfig.md
              - Timer: timer.md
              - Profil: profile.md
              - Liste der aktiven Pilze: active.md
              - Pilz-Alarm: alarm.md
            - Mehrere Gruppen: federation.md
            - Datenschutz: privacy.md
            - Unterstützen: support.md
        - locale: nl
          name: <img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f1f3-1f1f1.svg" height="20" style="vertical-align:middle;margin-right:0.3em;"> Nederlands
          build: true
          site_name: Pilzkampf Bot Handleiding
          site_description: Documentatie voor de Pilzkampf Bot voor Pikmin Bloom
          nav:
            - Startpagina: index.md
            - Paddenstoelengevecht: 
              - Overzicht: battle.md
              - Paddenstoelengevecht aanmaken: offer-mushroom.md
              - Deelnemen aan een paddenstoelengevecht: join-mushroom.md
            - Commando's:
              - Overzicht: commands.md
              - Instellingen: userconfig.md
              - Timer: timer.md
              - Profiel: profile.md
              - Lijst van actieve paddenstoelen: active.md
              - Paddenstoelwaarschuwing: alarm.md
            - Meerdere groepen: federation.md
            - Privacy: privacy.md
            - Ondersteunen: support.md
      material_alternate: true
  - search
  - offline

extra:
  social:
    - icon: simple/kofi
      link: https://ko-fi.com/G2G5OZ8MW
    - icon: simple/telegram
      link: https://t.me/pikminpilz_bot

markdown_extensions:
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: docs/includes/
  - footnotes

# ENTFERNE die separaten nav und nav_en Abschnitte komplett!
# Sie sind jetzt in den Plugin-Einstellungen enthalten

extra_javascript:
  - javascripts/font-toggle.js

extra_css:
  - stylesheets/font-toggle.css